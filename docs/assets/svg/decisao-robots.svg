<text x="970.0" y="562" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >Colete só o necessário, ou nada: dados pessoais têm</text>
