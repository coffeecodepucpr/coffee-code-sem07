<text x="360.0" y="714" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >User-Agent com contato, pedidos devagar, timeout, poucas páginas, sem burlar proteções</text>
