<text x="825.0" y="220" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7A553A" text-anchor="start" >...e, se falhasse de novo: 2 s, depois 4 s</text>
