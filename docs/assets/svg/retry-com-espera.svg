<text x="1030.0" y="410" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3B2A22" text-anchor="middle" >espere cada vez mais (o dobro)</text>
<text x="1030.0" y="442" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3B2A22" text-anchor="middle" >o Retry-After do servidor manda</text>
<text x="1030.0" y="474" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3B2A22" text-anchor="middle" >tenha um número máximo de tentativas</text>
